name: Netra tests

on:
  push:
    paths:
      - 'netra-snow/**'
      - '.github/workflows/netra-tests.yml'
  pull_request:
    paths:
      - 'netra-snow/**'
      - '.github/workflows/netra-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the Netra test suite (no ServiceNow instance or API key needed)
        run: node netra-snow/tests/run.js
