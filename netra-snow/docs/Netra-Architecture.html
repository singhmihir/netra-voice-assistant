<style>
:root {
  --violet-50:  #f5edff;
  --violet-200: #c69bf2;
  --violet-400: #b48af0;
  --violet-600: #8b4dc8;
  --violet-700: #6b2db0;
  --violet-900: #2a1560;
  --bg:         #0a0a14;
  --bg-card:    rgba(20, 14, 40, 0.65);
  --border:     rgba(180, 138, 240, 0.25);
  --text:       #e8e2f5;
  --muted:      #948cae;
  --green:      #5ee59a;
  --orange:     #ffa64a;
  --red:        #ff6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; line-height: 1.55; min-height: 100vh; }
body { background:
  radial-gradient(ellipse at 20% 0%, rgba(139, 77, 200, 0.18) 0%, transparent 60%),
  radial-gradient(ellipse at 80% 100%, rgba(106, 45, 176, 0.16) 0%, transparent 55%),
  var(--bg);
  background-attachment: fixed;
}
#root { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* ---------- HERO ---------- */
.hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 32px; align-items: center; padding: 56px 0 64px; }
.hero-text h1 { font-size: 64px; line-height: 1; letter-spacing: -2px; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--violet-50), var(--violet-200) 40%, var(--violet-600));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-text h2 { font-size: 22px; font-weight: 500; color: var(--violet-200); margin-bottom: 28px; }
.hero-text p { color: var(--muted); font-size: 17px; max-width: 540px; }
.hero-canvas { aspect-ratio: 1; max-width: 480px; margin-left: auto; position: relative; }
.hero-canvas canvas { width: 100% !important; height: 100% !important; display: block; border-radius: 50%; }
.hero-glow { position: absolute; inset: -8% -8% -8% -8%; pointer-events: none;
  background: radial-gradient(circle, rgba(180, 138, 240, 0.35) 0%, transparent 60%); }

.badge-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
.badge { padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: rgba(139, 77, 200, 0.18); border: 1px solid var(--border); color: var(--violet-50); }

/* ---------- NAV ---------- */
.tabnav { position: sticky; top: 0; z-index: 100; padding: 16px 0; backdrop-filter: blur(12px);
  background: rgba(10, 10, 20, 0.75); border-bottom: 1px solid var(--border); margin-bottom: 32px; }
.tabnav-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
.tabnav button { background: transparent; border: 1px solid transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: all 0.15s; }
.tabnav button:hover { color: var(--violet-50); background: rgba(180, 138, 240, 0.08); }
.tabnav button.active { color: var(--violet-50); background: rgba(180, 138, 240, 0.18); border-color: var(--border); }

/* ---------- CARDS ---------- */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px; backdrop-filter: blur(8px); margin-bottom: 24px; }
.card h3 { font-size: 22px; margin-bottom: 16px; color: var(--violet-50); letter-spacing: -0.5px; }
.card h4 { font-size: 15px; margin-bottom: 8px; color: var(--violet-200); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.card p { color: var(--text); font-size: 15px; margin-bottom: 12px; }
.card .meta { color: var(--muted); font-size: 13px; }
.card code { background: rgba(139, 77, 200, 0.15); padding: 2px 8px; border-radius: 4px;
  font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 13px; color: var(--violet-200); }

/* ---------- PIPELINE ---------- */
.pipeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 24px 0; }
.pipe-step { padding: 16px 12px; background: rgba(20, 14, 40, 0.5); border: 1px solid var(--border);
  border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s;
  position: relative; min-height: 110px; }
.pipe-step:hover { transform: translateY(-3px); border-color: var(--violet-400); }
.pipe-step.active { background: linear-gradient(135deg, rgba(180, 138, 240, 0.25), rgba(106, 45, 176, 0.15));
  border-color: var(--violet-400); box-shadow: 0 8px 32px rgba(180, 138, 240, 0.3); }
.pipe-step.live { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.pipe-step-num { font-size: 11px; color: var(--violet-200); font-weight: 600; margin-bottom: 4px; }
.pipe-step-icon { font-size: 24px; margin-bottom: 6px; }
.pipe-step-title { font-size: 12px; font-weight: 600; line-height: 1.2; }
.pipe-arrow { position: absolute; right: -16px; top: 50%; transform: translateY(-50%);
  color: var(--violet-400); font-size: 16px; z-index: 1; }
.pipe-detail { background: rgba(20, 14, 40, 0.7); border-left: 4px solid var(--violet-400);
  padding: 16px 20px; border-radius: 8px; margin-top: 16px; }
.pipe-detail h4 { color: var(--violet-200); margin-bottom: 6px; font-size: 13px; letter-spacing: 1px; }
.pipe-controls { display: flex; gap: 10px; margin-top: 16px; }
.btn { background: linear-gradient(135deg, var(--violet-600), var(--violet-700)); color: white;
  border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;
  font-size: 14px; transition: transform 0.15s; }
.btn:hover { transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--violet-200); }

/* ---------- TABLES ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 12px 14px; background: rgba(139, 77, 200, 0.15);
  color: var(--violet-200); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: top; }
td:first-child { font-family: monospace; color: var(--violet-50); }
tbody tr:hover { background: rgba(180, 138, 240, 0.05); }

/* ---------- GRID ---------- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.feat { padding: 16px; background: rgba(20, 14, 40, 0.5); border: 1px solid var(--border);
  border-radius: 10px; transition: all 0.2s; cursor: pointer; }
.feat:hover { background: rgba(180, 138, 240, 0.08); border-color: var(--violet-400); transform: translateY(-2px); }
.feat-rel { font-size: 10px; color: var(--violet-200); font-weight: 700; letter-spacing: 1px; }
.feat-title { font-size: 14px; font-weight: 600; margin: 4px 0 6px; color: var(--violet-50); }
.feat-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }

/* ---------- 3D LAYERS DIAGRAM ---------- */
.layer-stack { perspective: 1200px; padding: 60px 0; }
.layer-stack-inner { transform-style: preserve-3d; transition: transform 0.4s; }
.layer { padding: 18px 24px; margin-bottom: 8px; border-radius: 12px;
  background: linear-gradient(135deg, rgba(139, 77, 200, 0.22), rgba(106, 45, 176, 0.12));
  border: 1px solid var(--border); transform-origin: center; transition: all 0.3s; cursor: pointer; }
.layer:hover { transform: translateZ(20px) scale(1.02); box-shadow: 0 20px 40px rgba(139, 77, 200, 0.3); border-color: var(--violet-400); }
.layer-label { font-size: 11px; letter-spacing: 1.5px; color: var(--violet-200); font-weight: 700; }
.layer-title { font-size: 18px; font-weight: 600; margin: 4px 0 8px; }
.layer-detail { font-size: 13px; color: var(--muted); }

/* ---------- DEMO BOX ---------- */
.demo { background: linear-gradient(135deg, rgba(180, 138, 240, 0.12), rgba(106, 45, 176, 0.08));
  border: 1px solid var(--violet-400); border-radius: 12px; padding: 24px; margin: 20px 0; }

.demo-step { padding: 10px 14px; background: rgba(20, 14, 40, 0.5); border-left: 3px solid var(--violet-400);
  border-radius: 4px; margin-bottom: 8px; font-size: 13px; }
.demo-step b { color: var(--violet-200); }

/* ---------- FOOTER ---------- */
footer { padding: 48px 0 24px; text-align: center; color: var(--muted); font-size: 13px; }

/* Responsive */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .hero-text h1 { font-size: 42px; }
  .pipeline { grid-template-columns: repeat(3, 1fr); }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ======================================================================
   3D ORB - Three.js sphere with iris/pupil + voice ring + breathing
   ====================================================================== */
function Orb3D() {
  const mountRef = useRef(null);
  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;
    const w = mount.clientWidth, h = mount.clientHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
    camera.position.set(0, 0, 5);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(window.devicePixelRatio);
    mount.appendChild(renderer.domElement);

    // Iris sphere - radial-gradient via shader-light material
    const sphereGeo = new THREE.SphereGeometry(1.6, 96, 96);
    const sphereMat = new THREE.MeshPhysicalMaterial({
      color: 0x8b4dc8,
      emissive: 0x6b2db0,
      emissiveIntensity: 0.55,
      roughness: 0.15,
      metalness: 0.25,
      clearcoat: 0.85,
      clearcoatRoughness: 0.2,
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphere);

    // Pupil - small dark sphere on top of iris
    const pupilGeo = new THREE.SphereGeometry(0.45, 48, 48);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x1a0838 });
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.position.z = 1.25;
    scene.add(pupil);

    // Outer ring - voice ring
    const ringGeo = new THREE.TorusGeometry(2.1, 0.04, 16, 96);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xc69bf2, transparent: true, opacity: 0.55 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);

    // 24 vertices around the ring (matches Netra's voice ring)
    const vertexGroup = new THREE.Group();
    const vertices = [];
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xb48af0 })
      );
      dot.position.set(Math.cos(a) * 2.45, Math.sin(a) * 2.45, 0);
      vertexGroup.add(dot);
      vertices.push({ dot, angle: a });
    }
    scene.add(vertexGroup);

    // Lights
    scene.add(new THREE.AmbientLight(0x553388, 0.6));
    const key = new THREE.DirectionalLight(0xb48af0, 1.2);
    key.position.set(2, 3, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xff9ce0, 0.4);
    fill.position.set(-3, -2, 2);
    scene.add(fill);

    // Animation
    let t = 0, rafId;
    const animate = () => {
      t += 0.008;
      sphere.rotation.y = t * 0.6;
      sphere.rotation.x = Math.sin(t * 0.4) * 0.1;
      // Breathing
      const breath = 1 + Math.sin(t * 1.2) * 0.05;
      sphere.scale.set(breath, breath, breath);
      sphereMat.emissiveIntensity = 0.45 + Math.sin(t * 1.2) * 0.15;
      // Voice ring vertices pulse outward, faux-FFT
      vertices.forEach((v, i) => {
        const r = 2.35 + Math.sin(t * 2 + i * 0.8) * 0.18;
        v.dot.position.set(Math.cos(v.angle) * r, Math.sin(v.angle) * r, 0);
        const s = 0.7 + Math.sin(t * 3 + i * 0.5) * 0.35;
        v.dot.scale.set(s, s, s);
      });
      vertexGroup.rotation.z = t * 0.15;
      ring.rotation.z = -t * 0.1;
      pupil.position.z = 1.25 + Math.sin(t * 0.9) * 0.08;
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(animate);
    };
    animate();

    const onResize = () => {
      const w2 = mount.clientWidth, h2 = mount.clientHeight;
      renderer.setSize(w2, h2);
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      mount.innerHTML = '';
    };
  }, []);
  return <div ref={mountRef} style={{ width: '100%', height: '100%' }} />;
}

function TabNav({ tabs, active, onChange }) {
  return (

function Pipeline() {
  const [active, setActive] = useState(0);
  const [playing, setPlaying] = useState(false);
  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setActive(a => {
        if (a >= PIPELINE.length - 1) { setPlaying(false); return a; }
        return a + 1;
      });
    }, 1400);
    return () => clearInterval(id);
  }, [playing]);
  const step = PIPELINE[active];
  return (
    <div className="card">
      <h3>🌊 End-to-End Voice Pipeline</h3>
      <p className="meta">Click a step or hit Play. Each step is a real piece of the live R3.8 codebase.</p>
      <div className="pipeline">
        {PIPELINE.map((s, i) => (
          <div key={i} className={'pipe-step' + (active === i ? ' active' : '') + (playing && active === i ? ' live' : '')}
               onClick={() => setActive(i)}>
            <div className="pipe-step-num">STEP {i + 1}</div>
            <div className="pipe-step-icon">{s.icon}</div>
            <div className="pipe-step-title">{s.title}</div>
          </div>
        ))}
      </div>
      <div className="pipe-detail">
        <h4>STEP {active + 1} — {step.title.toUpperCase()}</h4>
        <p>{step.detail}</p>
        <div style={{ marginTop: 10, fontSize: 12 }}>
          <span style={{ color: 'var(--violet-200)' }}>API:</span> <code>{step.api}</code>
        </div>
        <div style={{ marginTop: 4, fontSize: 12 }}>
          <span style={{ color: 'var(--violet-200)' }}>Code:</span> <code>{step.code}</code>
        </div>
      </div>
      <div className="pipe-controls">
        <button className="btn" onClick={() => { setActive(0); setPlaying(true); }}>▶ Play full flow</button>
        <button className="btn btn-ghost" onClick={() => { setActive(0); setPlaying(false); }}>↺ Reset</button>
      </div>
    </div>
  );
}

function AISection() {
  return (
    <div className="card">
      <h3>🤖 How AI is used</h3>
      <div className="grid-2">
        <div>
          <h4>1. Chat reasoning</h4>
          <p>Gemini <code>flash-lite-latest</code> runs every turn. The system prompt is built per-request from <code>_systemPrompt()</code> — includes user name, capabilities tour, accessibility constraints, voice style (R3.8 prosody rules), language mirroring, sentiment behaviour. 52 tools are declared via <code>_toolDeclarations()</code>; Gemini picks zero or more per turn.</p>
        </div>
        <div>
          <h4>2. Embeddings (RAG)</h4>
          <p><code>gemini-embedding-001</code> (768-dim) used asymmetrically — <code>RETRIEVAL_QUERY</code> on user input, <code>RETRIEVAL_DOCUMENT</code> on KB articles. Cosine similarity ranks top 3 articles. Article embeddings cached in <code>x_196061_netra_v1_kb_embedding</code> with sys_id + cached_at so repeat lookups are zero-cost.</p>
        </div>
        <div>
          <h4>3. Structured output (NetraReasoning)</h4>
          <p>Three tools use Gemini's <code>responseMimeType: 'application/json'</code> + <code>responseSchema</code> for guaranteed-shape output: <code>triage_approvals</code> classifies items ROUTINE/SCRUTINY/RISKY with rationale; <code>narrate_script</code> emits 4–6 sentence accessible narration; <code>build_query</code> outputs a ServiceNow encoded query string.</p>
        </div>
        <div>
          <h4>4. Prompt engineering for prosody (R3.8)</h4>
          <p>System prompt instructs Gemini to wrap stress words in <code>**double asterisks**</code> (→ SSML <code>&lt;emphasis level="strong"&gt;</code>), use <code>...</code> for thinking pauses (→ 380ms break), and sprinkle natural verbal fillers (<code>umm, uhh, well, hmm</code>) sparingly. Client-side SSML builder converts these markers into Edge TTS prosody.</p>
        </div>
      </div>
    </div>
  );
}
