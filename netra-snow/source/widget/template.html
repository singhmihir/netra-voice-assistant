<!--
  Netra Mic widget template - v6 (voice-only, blind-first)
  No chat panel. No typing. No buttons.
  Just an audio assistant. A single pulsing orb is the only visual cue,
  for the benefit of sighted helpers + low-vision users. All meaningful
  state is announced via ARIA live regions for screen readers.
-->
<div class="netra-root"
     ng-class="['netra-state-' + c.state]"
     role="region"
     aria-label="Netra voice assistant">

  <!--
    SR live region. role=status is polite; we use this for transient
    state announcements ("listening", "thinking") so JAWS/NVDA pick
    them up without interrupting the user.
  -->
  <div class="netra-sr-only" role="status" aria-live="polite" aria-atomic="true">
    {{c.stateLabel}}
  </div>

  <!--
    SR assertive region for hearable responses. Pushes the announcement
    immediately - used for Netra's spoken replies so screen readers
    convey them even if TTS is muted at the OS level.
  -->
  <div class="netra-sr-only" role="alert" aria-live="assertive" aria-atomic="true">
    {{c.spoken}}
  </div>

  <!-- Orb - the only persistent visual element -->
  <button class="netra-orb"
          ng-click="c.tap()"
          aria-label="Netra is {{c.stateLabel}}. Say Netra to talk, or press Alt N."
          title="Say 'Netra' to talk. Alt+N to toggle.">
    <span class="netra-orb-ring netra-orb-ring-1" aria-hidden="true"></span>
    <span class="netra-orb-ring netra-orb-ring-2" aria-hidden="true"></span>
    <span class="netra-orb-core" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
        <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-4.08A7 7 0 0 0 19 11z"/>
      </svg>
    </span>
  </button>

  <!--
    Visible transcript card for sighted helpers + screen readers.
    Hidden when there is nothing to show. Last user utterance + last
    Netra reply only - this is not a chat history, it intentionally
    forgets to keep cognitive load low.
  -->
  <div class="netra-card"
       ng-show="c.lastHeard || c.spoken"
       aria-hidden="true">
    <div class="netra-card-row" ng-show="c.lastHeard">
      <span class="netra-card-label">You</span>
      <span class="netra-card-text">{{c.lastHeard}}</span>
    </div>
    <div class="netra-card-row netra-card-row-bot" ng-show="c.spoken">
      <span class="netra-card-label">Netra</span>
      <span class="netra-card-text">{{c.spoken}}</span>
    </div>
  </div>

  <!--
    Initial-greeting gate. Some browsers refuse to start the
    SpeechRecognition or AudioContext without a user gesture. Until
    the sighted helper (or the user pressing space/enter) interacts
    once, we surface this big accessible prompt.
  -->
  <button class="netra-gate"
          ng-show="c.needsTap"
          ng-click="c.tap()"
          aria-label="Press here to start Netra. Press once and Netra will begin listening.">
    <span class="netra-gate-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-4.08A7 7 0 0 0 19 11z"/></svg>
    </span>
    <span class="netra-gate-text">
      <strong>Press here to start Netra</strong>
      <span>Then just say "Netra" to talk.</span>
    </span>
  </button>

</div>
