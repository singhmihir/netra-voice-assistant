<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Netra Voice Assistant">
  <title>Netra — Voice Assistant</title>
  <desc>Release X lock-up: the Netra eye inside the open violet voice ring, followed by the Netra wordmark and 'Voice Assistant' tagline. Works on light backgrounds.</desc>
  <defs>
    <radialGradient id="nl-iris" cx="38%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#eafff2"/>
      <stop offset="18%"  stop-color="#7fffb0"/>
      <stop offset="55%"  stop-color="#2eb858"/>
      <stop offset="100%" stop-color="#021a0d"/>
    </radialGradient>
    <linearGradient id="nl-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8b3df0"/>
      <stop offset="55%"  stop-color="#c660ff"/>
      <stop offset="72%"  stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#6920b8"/>
    </linearGradient>
  </defs>

  <!-- Mark: eye + open voice ring, centred at (110,110), ring r=72 -->
  <g fill="none" stroke="url(#nl-ring)" stroke-width="12" stroke-linecap="round">
    <path d="M38 110 A72 72 0 0 1 110 38"/>
    <path d="M182 110 A72 72 0 0 1 110 182"/>
  </g>
  <path d="M46 110 Q110 52 174 110 Q110 168 46 110 Z"
        fill="#0a0614" stroke="#4c1d95" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="110" cy="110" r="40" fill="url(#nl-iris)"/>
  <circle cx="110" cy="110" r="16" fill="#001a0a"/>
  <circle cx="98"  cy="98"  r="6.6" fill="#ffffff" opacity="0.9"/>

  <!-- Wordmark -->
  <text x="228" y="132" font-family="Segoe UI, Inter, -apple-system, sans-serif"
        font-size="84" font-weight="800" letter-spacing="-2" fill="#4c1d95">Netra</text>
  <text x="232" y="172" font-family="Segoe UI, Inter, -apple-system, sans-serif"
        font-size="18" font-weight="600" letter-spacing="6" fill="#475569">VOICE ASSISTANT</text>

  <!-- Amber heat-treatment tick - nod to the case-hardened ring patina -->
  <circle cx="470" cy="76" r="5" fill="#ffb84d"/>
</svg>
