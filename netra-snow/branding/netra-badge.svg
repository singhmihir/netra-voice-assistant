<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Built with Netra" badge - carries ONLY the Netra mark; it does not
  reproduce or fuse any other organisation's trademark. Release X
  edition: violet voice-ring identity on a dark tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" role="img" aria-label="Built with Netra Voice Assistant">
  <title>Built with Netra</title>
  <defs>
    <radialGradient id="nb-iris" cx="38%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#eafff2"/>
      <stop offset="18%"  stop-color="#7fffb0"/>
      <stop offset="55%"  stop-color="#2eb858"/>
      <stop offset="100%" stop-color="#021a0d"/>
    </radialGradient>
    <linearGradient id="nb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8b3df0"/>
      <stop offset="55%"  stop-color="#c660ff"/>
      <stop offset="72%"  stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#6920b8"/>
    </linearGradient>
  </defs>

  <!-- Dark violet pill -->
  <rect x="0" y="0" width="360" height="90" rx="18" fill="#12081f" stroke="#3a2a55" stroke-width="1.5"/>

  <!-- Mini mark: eye in the open voice ring, centred at (52,45), ring r=30 -->
  <g fill="none" stroke="url(#nb-ring)" stroke-width="5" stroke-linecap="round">
    <path d="M22 45 A30 30 0 0 1 52 15"/>
    <path d="M82 45 A30 30 0 0 1 52 75"/>
  </g>
  <path d="M26 45 Q52 22 78 45 Q52 68 26 45 Z"
        fill="#0a0614" stroke="#d8c8ff" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="52" cy="45" r="16" fill="url(#nb-iris)"/>
  <circle cx="52" cy="45" r="6.4" fill="#001a0a"/>
  <circle cx="47" cy="40" r="2.6" fill="#ffffff" opacity="0.9"/>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="120" y="36" font-size="14" letter-spacing="3" fill="#b39ddb" font-weight="600">BUILT WITH</text>
    <text x="120" y="68" font-size="32" font-weight="800" letter-spacing="-1" fill="#d8c8ff">Netra</text>
  </g>
</svg>
