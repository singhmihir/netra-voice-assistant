<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Built with Netra" badge - safe to drop next to any approved Deloitte
  lock-up that you produce through Deloitte Brand Space. This badge
  carries ONLY the Netra mark; it does not reproduce or fuse any other
  organisation's trademark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" role="img" aria-label="Built with Netra Voice Assistant">
  <title>Built with Netra</title>
  <defs>
    <radialGradient id="iris3" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0e2e7a"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="360" height="90" rx="18" ry="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Mini eye -->
  <g transform="translate(20, 26)">
    <path d="M 0,20 Q 20,0 40,0 Q 60,0 80,20 Q 60,40 40,40 Q 20,40 0,20 Z"
          fill="none" stroke="#0e2e7a" stroke-width="3"/>
    <circle cx="40" cy="20" r="13" fill="url(#iris3)"/>
    <circle cx="40" cy="20" r="5"  fill="#0a1530"/>
    <circle cx="36" cy="16" r="2"  fill="#ffffff" opacity="0.9"/>
    <g stroke="#22b573" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 68 20 Q 75 12 82 20"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(120, 0)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="36" font-size="14" letter-spacing="3" fill="#475569" font-weight="600">BUILT WITH</text>
    <text x="0" y="68" font-size="32" font-weight="800" letter-spacing="-1" fill="#0e2e7a">Netra</text>
  </g>
</svg>
