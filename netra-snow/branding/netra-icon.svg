<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Netra">
  <title>Netra</title>
  <desc>Prism edition: an eye with an iridescent full-spectrum ring on a deep cosmic square — the mark of a voice whose colour shifts as she speaks.</desc>
  <defs>
    <!-- violet prism iris -->
    <radialGradient id="iris2" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#f4ecff"/>
      <stop offset="24%"  stop-color="#c7a6ff"/>
      <stop offset="60%"  stop-color="#7a3df0"/>
      <stop offset="100%" stop-color="#1c0a3d"/>
    </radialGradient>
    <!-- full-spectrum prism ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#37e6a8"/>
      <stop offset="28%"  stop-color="#41c6ff"/>
      <stop offset="54%"  stop-color="#c660ff"/>
      <stop offset="78%"  stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ff5f9e"/>
    </linearGradient>
    <!-- deep cosmic background -->
    <radialGradient id="bg" cx="50%" cy="36%" r="90%">
      <stop offset="0%"   stop-color="#221240"/>
      <stop offset="55%"  stop-color="#140a28"/>
      <stop offset="100%" stop-color="#090312"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="45%"  stop-color="rgba(140,80,255,0)"/>
      <stop offset="100%" stop-color="rgba(140,80,255,0.30)"/>
    </radialGradient>
    <!-- aurora accents in the corners -->
    <radialGradient id="auA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(65,198,255,0.34)"/>
      <stop offset="100%" stop-color="rgba(65,198,255,0)"/>
    </radialGradient>
    <radialGradient id="auB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(255,95,158,0.26)"/>
      <stop offset="100%" stop-color="rgba(255,95,158,0)"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGlow)"/>
  <circle cx="52"  cy="204" r="86" fill="url(#auA)"/>
  <circle cx="212" cy="48"  r="78" fill="url(#auB)"/>

  <!-- Prism ring: two open arcs sweeping the full spectrum -->
  <g fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round">
    <path d="M48 128 A80 80 0 0 1 128 48"/>
    <path d="M208 128 A80 80 0 0 1 128 208"/>
  </g>

  <!-- Eye mark, centred -->
  <g>
    <path d="M56 128 Q128 62 200 128 Q128 194 56 128 Z"
          fill="#0a0614" stroke="#d8c8ff" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="42" fill="url(#iris2)"/>
    <circle cx="128" cy="128" r="17" fill="#07001a"/>
    <circle cx="118" cy="118" r="6.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="139" cy="139" r="3.2" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
