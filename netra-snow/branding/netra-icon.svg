<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Netra">
  <title>Netra</title>
  <defs>
    <radialGradient id="iris2" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="55%"  stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0e2e7a"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0e2e7a"/>
      <stop offset="100%" stop-color="#1a3b8a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- Eye mark, centred -->
  <g transform="translate(28, 76)">
    <path d="M 0,52 Q 50,0 100,0 Q 150,0 200,52 Q 150,104 100,104 Q 50,104 0,52 Z"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="100" cy="52" r="36" fill="url(#iris2)"/>
    <circle cx="100" cy="52" r="15" fill="#0a1530"/>
    <circle cx="92"  cy="44" r="5"  fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Green sound accent above the eye -->
  <g transform="translate(128, 38)" stroke="#22b573" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M -10 22 Q 0 8 10 22"/>
    <path d="M -18 22 Q 0 -2 18 22"/>
  </g>
</svg>
