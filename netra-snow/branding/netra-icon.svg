<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Netra">
  <title>Netra</title>
  <defs>
    <!-- App tile: deep violet-black, matching the widget's --orb backdrop -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#12081f"/>
      <stop offset="55%"  stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <!-- Green iris sphere, 3D shaded from upper-left (mirrors the live orb) -->
    <radialGradient id="iris" cx="38%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#eafff2"/>
      <stop offset="16%"  stop-color="#7fffb0"/>
      <stop offset="52%"  stop-color="#2eb858"/>
      <stop offset="82%"  stop-color="#0a4a25"/>
      <stop offset="100%" stop-color="#021a0d"/>
    </radialGradient>
    <radialGradient id="pupil" cx="50%" cy="46%" r="55%">
      <stop offset="0%"  stop-color="#0a2a16"/>
      <stop offset="60%" stop-color="#001a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Case-hardened violet voice ring, mirrors --netra-voice-stroke-gradient -->
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="20" y1="40" x2="236" y2="216">
      <stop offset="0%"   stop-color="#6920b8"/>
      <stop offset="30%"  stop-color="#8b3df0"/>
      <stop offset="52%"  stop-color="#c660ff"/>
      <stop offset="66%"  stop-color="#ffb84d"/>
      <stop offset="84%"  stop-color="#a040e8"/>
      <stop offset="100%" stop-color="#5a1aa0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="58" ry="58" fill="url(#tile)"/>

  <!-- Violet voice ring: two audio-reactive arcs sweeping around the eye -->
  <g fill="none" stroke="url(#ring)" stroke-linecap="round" opacity="0.9">
    <path d="M 40,128 A 88,88 0 0 1 128,40" stroke-width="7" filter="url(#soft)"/>
    <path d="M 40,128 A 88,88 0 0 1 128,40" stroke-width="4"/>
    <path d="M 216,128 A 88,88 0 0 1 128,216" stroke-width="7" filter="url(#soft)"/>
    <path d="M 216,128 A 88,88 0 0 1 128,216" stroke-width="4"/>
  </g>

  <!-- Almond eye outline (da Vinci lids) -->
  <path d="M 44,128 Q 128,58 212,128 Q 128,198 44,128 Z"
        fill="#0a0614" stroke="#d8c8ff" stroke-width="5" stroke-linejoin="round" opacity="0.96"/>

  <!-- Green iris sphere with pupil + catchlight -->
  <circle cx="128" cy="128" r="46" fill="url(#iris)"/>
  <circle cx="128" cy="128" r="19" fill="url(#pupil)"/>
  <circle cx="114" cy="113" r="7"  fill="#ffffff" opacity="0.92"/>
  <circle cx="140" cy="140" r="3"  fill="#aef0d0" opacity="0.7"/>

  <!-- Green sound accent above the eye -->
  <g transform="translate(128, 44)" stroke="#7fffb0" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M -9 16 Q 0 4 9 16"/>
    <path d="M -17 18 Q 0 -4 17 18"/>
  </g>
</svg>
